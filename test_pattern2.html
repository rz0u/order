<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-10 bg-white">
  <h2>Contour (Radial)</h2>
  <div class="w-64 h-20 border border-gray-200 bg-[image:repeating-radial-gradient(circle_at_center,rgba(239,68,68,0.05),rgba(239,68,68,0.05)_8px,rgba(239,68,68,0.15)_8px,rgba(239,68,68,0.15)_16px)] ring-1 ring-inset ring-red-500/20">
    Contour
  </div>
  <br>
  <h2>Cross Hatch</h2>
  <div class="w-64 h-20 border border-gray-200 bg-[image:repeating-linear-gradient(45deg,transparent,transparent_8px,rgba(239,68,68,0.15)_8px,rgba(239,68,68,0.15)_16px),repeating-linear-gradient(-45deg,rgba(239,68,68,0.05),rgba(239,68,68,0.05)_8px,rgba(239,68,68,0.15)_8px,rgba(239,68,68,0.15)_16px)] ring-1 ring-inset ring-red-500/20">
    Cross
  </div>
</body>
</html>
